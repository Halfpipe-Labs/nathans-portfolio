<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nathan Pearson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: #0A0A0A;
    color: #F5F0E8;
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  p {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: #9A9590;
    line-height: 1.7;
  }
  section[id], footer[id] { scroll-margin-top: 60px; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #0A0A0A; }
  ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 3px; }

  /* Nav hover states via plain CSS since we can't do :hover in inline React styles */
  .nav-link:hover { color: #F5F0E8 !important; }
  .contact-btn:hover { background: #FFE234 !important; color: #0A0A0A !important; }
  .social-link:hover { color: #F5F0E8 !important; }
  .cta-outline:hover { border-color: #F5F0E8 !important; background: rgba(245,240,232,0.04) !important; }
  .footer-link:hover { opacity: 1 !important; }
  .subscribe-btn:hover { background: rgba(93,202,165,0.1) !important; }
  .all-posts:hover { color: #F5F0E8 !important; }

  /* =========================================================
     MOBILE — overrides React inline styles via !important.
     These rules are the source of truth for layout ≤768px.
     The JS isMobile checks in components do the same thing;
     these CSS rules act as a guaranteed fallback if component
     files are cached and serve stale code.
     ========================================================= */
  @media (max-width: 768px) {

    /* Prevent any element causing horizontal scroll */
    html { overflow-x: hidden; }

    /* --- NAV --- */
    nav { padding-left: 20px !important; padding-right: 20px !important; }
    nav ul { display: none !important; }

    /* --- SECTION INNER PADDING (all sections have an id; direct child div is the inner wrapper) --- */
    #pillars > div,
    #about   > div,
    #writing > div,
    #links   > div,
    footer   > div {
      padding-left: 20px !important;
      padding-right: 20px !important;
    }
    /* Hero inner is the 2nd child of its section (1st is the ticker bar) */
    #hero section > div:nth-child(2) {
      padding-left: 20px !important;
      padding-right: 20px !important;
      padding-bottom: 48px !important;
    }

    /* --- HERO: hide portrait, shrink name, stack bottom row --- */
    /* Portrait slot is the 3rd child of the section */
    #hero section > div:nth-child(3) { display: none !important; }
    /* Name letter spans have font-size: clamp(80px, …) — shrink the minimum */
    #hero section span[style*="clamp(80px"] {
      font-size: clamp(52px, 13vw, 172px) !important;
    }
    /* Bottom content row (last child of inner div): stack vertically */
    #hero section > div:nth-child(2) > div:last-child {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 32px !important;
    }
    /* Identity badges (bottomRight): align left on mobile */
    #hero section > div:nth-child(2) > div:last-child > div:last-child {
      align-items: flex-start !important;
    }

    /* --- ABOUT: single-column layout --- */
    /* Grid has gridTemplateColumns: "360px 1fr" — collapse to 1fr */
    #about [style*="360px"] {
      grid-template-columns: 1fr !important;
      gap: 40px !important;
    }
    #about [style*="sticky"] { position: static !important; }
    /* Portrait frame aspect ratio */
    #about [style*="3/4"] {
      aspect-ratio: 4/3 !important;
      max-height: 280px !important;
    }

    /* --- PILLARS: single-column grids --- */
    /* Matches both "1fr 1fr" (top) and "1fr 1fr 1fr" (bottom) */
    #pillars [style*="1fr 1fr"] { grid-template-columns: 1fr !important; }
    /* Section header side-by-side → stacked */
    #pillars [style*="auto 1fr auto"] { grid-template-columns: 1fr !important; }

    /* --- WRITING: stack header; convert post rows from grid to flex-column --- */
    #writing > div > div:first-child {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 20px !important;
    }
    /* Post rows have gridTemplateColumns: "160px 1fr 32px" */
    #writing a[style*="160px"] {
      display: flex !important;
      flex-direction: column !important;
      gap: 6px !important;
      padding: 20px 0 !important;
      position: relative !important;
    }
    /* postMeta (date/readtime): keep but show inline */
    #writing a[style*="160px"] > div:first-child {
      display: flex !important;
      flex-direction: row !important;
      gap: 12px !important;
      align-items: center !important;
      padding-top: 0 !important;
    }
    /* Arrow: absolute top-right so it doesn't break the column flow */
    #writing a[style*="160px"] > div:nth-child(3) {
      position: absolute !important;
      top: 20px !important;
      right: 0 !important;
    }

    /* --- LINKS: convert rows from 4-col grid to flex-column --- */
    /* Rows have gridTemplateColumns: "160px 220px 1fr 32px" */
    #links a[style*="160px"] {
      display: flex !important;
      flex-direction: column !important;
      gap: 6px !important;
      padding: 16px 0 !important;
      position: relative !important;
    }
    /* Hide the description (3rd span child) */
    #links a[style*="160px"] > span:nth-child(3) { display: none !important; }
    /* Arrow: absolute right, vertically centred */
    #links a[style*="160px"] > span:last-child {
      position: absolute !important;
      top: 50% !important;
      right: 0 !important;
      transform: translateY(-50%) !important;
    }

    /* --- FOOTER: stack top, 2-col link grid --- */
    footer > div > div:first-child {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 16px !important;
    }
    footer [style*="text-align: right"] { text-align: left !important; }
    /* Mid grid: repeat(4, 1fr) → repeat(2, 1fr) */
    footer [style*="repeat(4, 1fr)"] {
      grid-template-columns: repeat(2, 1fr) !important;
    }
    footer > div > div:last-child {
      flex-direction: column !important;
      gap: 8px !important;
    }
  }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="components/BackgroundFX.jsx?v=3"></script>
<script type="text/babel" src="tweaks-panel.jsx?v=3"></script>
<script type="text/babel" src="components/hooks.jsx?v=2"></script>
<script type="text/babel" src="components/Nav.jsx?v=12"></script>
<script type="text/babel" src="components/HeroA.jsx?v=12"></script>
<script type="text/babel" src="components/HeroB.jsx?v=11"></script>
<script type="text/babel" src="components/HeroC.jsx?v=13"></script>
<script type="text/babel" src="components/Pillars.jsx?v=15"></script>
<script type="text/babel" src="components/About.jsx?v=13"></script>
<script type="text/babel" src="components/Writing.jsx?v=12"></script>
<script type="text/babel" src="components/Links.jsx?v=12"></script>
<script type="text/babel" src="components/Footer.jsx?v=12"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroVariant": "C",
  "backgroundFX": "combo"
}/*EDITMODE-END*/;

const heroLabels = {
  A: 'A — Editorial Split',
  B: 'B — Full-Bleed Portrait',
  C: 'C — Type Maximalist',
};

const heroDescriptions = {
  A: 'Giant name left, portrait bleeds in from right. Animated word-cycle tagline.',
  B: 'Portrait fills the viewport. Name overlaid massive. Staggered entrance animation.',
  C: 'Typographic maximalism. Letter-by-letter stagger. Scroll-driven ticker.',
};

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeSection, setActiveSection] = React.useState('hero');

  // Track active section for nav highlight
  React.useEffect(() => {
    const sections = ['hero', 'pillars', 'about', 'writing', 'links'];
    const obs = new IntersectionObserver(
      entries => {
        entries.forEach(e => {
          if (e.isIntersecting) setActiveSection(e.target.id);
        });
      },
      { rootMargin: '-40% 0px -55% 0px' }
    );
    sections.forEach(id => {
      const el = document.getElementById(id);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, []);

  const HeroComponent = tweaks.heroVariant === 'B' ? HeroB : tweaks.heroVariant === 'C' ? HeroC : HeroA;

  return (
    <>
      {tweaks.backgroundFX === 'combo' && <CursorAndWash />}
      {tweaks.backgroundFX === 'cursor' && <CursorTrail />}
      {tweaks.backgroundFX === 'grain' && <FilmGrain />}
      <Nav activeSection={activeSection} />
      <main>
        <div id="hero"><HeroComponent /></div>
        <Pillars />
        <About />
        <Writing />
        <Links />
        <Footer />
      </main>

      <TweaksPanel>
        <TweakSection label="Hero Variant">
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {['A', 'B', 'C'].map(v => (
              <button
                key={v}
                onClick={() => setTweak('heroVariant', v)}
                style={{
                  background: tweaks.heroVariant === v ? '#1A1A1A' : 'transparent',
                  border: `1px solid ${tweaks.heroVariant === v ? '#FFE234' : '#2A2A2A'}`,
                  color: tweaks.heroVariant === v ? '#FFE234' : '#9A9590',
                  padding: '10px 14px',
                  fontFamily: "'DM Sans', sans-serif",
                  fontSize: 12,
                  fontWeight: tweaks.heroVariant === v ? 700 : 400,
                  letterSpacing: '0.06em',
                  cursor: 'pointer',
                  textAlign: 'left',
                  display: 'flex',
                  flexDirection: 'column',
                  gap: 4,
                  transition: 'all 150ms ease',
                }}
              >
                <span style={{ fontWeight: 700 }}>{heroLabels[v]}</span>
                <span style={{
                  fontSize: 11,
                  color: tweaks.heroVariant === v ? '#9A9590' : '#4A4742',
                  lineHeight: 1.4,
                  fontWeight: 400,
                }}>{heroDescriptions[v]}</span>
              </button>
            ))}
          </div>
        </TweakSection>
        <TweakSection label="Background FX">
          <TweakRadio
            label="Effect"
            value={tweaks.backgroundFX}
            options={['none', 'combo', 'grain']}
            onChange={v => setTweak('backgroundFX', v)}
          />
          <div style={{ fontSize: 10, color: 'rgba(41,38,27,0.45)', lineHeight: 1.4, marginTop: 2 }}>
            {tweaks.backgroundFX === 'combo' && 'Cursor trail + section colour wash'}
            {tweaks.backgroundFX === 'grain' && 'Animated film grain overlay'}
            {tweaks.backgroundFX === 'none' && 'No effect'}
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
